<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            border: 8px solid #f8c8e8;
            padding: 20px;
            margin: 15px;
            font-size: 15px;
        }
        h2 {
            text-align: center;
            margin-bottom: 16px;
        }
        .desc {
            margin-bottom: 18px;
            line-height: 1.5;
        }
        table.survey-table {
            width: 100%;
            border-collapse: collapse;
        }
        .survey-table td {
            border: 1px solid #f8c8e8;
            padding: 12px 10px;
        }
        .big-textarea {
            width: 98%;
            height: 90px;
            margin-top:6px;
        }
        .button-wrap {
            text-align: center;
            margin-top:16px;
        }
        .button-wrap input {
            padding:2px 10px;
            margin:0 5px;
        }
    </style>
</head>
<body>
    <h2>图书馆读者调查问卷</h2>

    <p class="desc">
        为了能够及时了解您对图书馆的需求，提升我校图书馆文献资源建设的质量和水平，更好的为我校教学科研服务，我馆特设计了问卷调查题目如下，请协助填写，谢谢您的合作！
    </p>

    <form>
        <table class="survey-table">
            <tr>
                <td>
                    1.您的年级<br>
                    <select>
                        <option>请你选择</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    2.您的专业<br>
                    <input type="text" style="width:320px;">
                </td>
            </tr>
            <tr>
                <td>
                    3.对于图书馆的阅览环境<br>
                    <input type="radio" name="env">满意<br>
                    <input type="radio" name="env">基本满意<br>
                    <input type="radio" name="env">不满意
                    您的建议：<input type="text">
                </td>
            </tr>
            <tr>
                <td>
                    4.您到图书馆的原因是（可多选）：<br>
                    <input type="checkbox">借阅专业图书<br>
                    <input type="checkbox">随便坐坐，翻翻书刊<br>
                    <input type="checkbox">借阅光盘<br>
                    <input type="checkbox">参加图书馆组织的活动<br>
                    <input type="checkbox">自习，复习功课<br>
                    <input type="checkbox">上网<br>
                    <input type="checkbox">检索电子文献
                </td>
            </tr>
            <tr>
                <td>
                    5.您到图书馆的频率<br>
                    <input type="radio" name="freq">几乎每天<br>
                    <input type="radio" name="freq">每周1-2次<br>
                    <input type="radio" name="freq">每月1-2次<br>
                    <input type="radio" name="freq">几乎不去
                </td>
            </tr>
            <tr>
                <td>
                    6.您对学校的建议<br>
                    <textarea class="big-textarea" placeholder="请您提出宝贵建议："></textarea>
                </td>
            </tr>
        </table>

        <div class="button-wrap">
            <input type="submit" value="提交答案">
            <input type="reset" value="清 空">
        </div>
    </form>
</body>
</html>
