<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <!-- 字符编码与移动端适配设置 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人名片</title>
    <!-- 引入外部样式表，实现结构与样式分离 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 名片卡片容器 -->
    <div class="card">

        <!-- 圆形头像（此处使用占位图，可替换为本地图片路径） -->
        <img class="avatar" src="https://i.pravatar.cc/240?img=12" alt="个人头像">

        <!-- 姓名 -->
        <h1 class="name">张伟</h1>

        <!-- 职位 -->
        <p class="title">前端开发工程师</p>

        <!-- 分隔线 -->
        <div class="divider"></div>

        <!-- 联系方式列表 -->
        <ul class="contact">
            <!-- 电话 -->
            <li class="contact-item">
                <span class="icon">📞</span>
                <span>138-0000-0000</span>
            </li>
            <!-- 邮箱 -->
            <li class="contact-item">
                <span class="icon">✉️</span>
                <span>zhangwei@example.com</span>
            </li>
            <!-- 所在城市 -->
            <li class="contact-item">
                <span class="icon">📍</span>
                <span>中国 · 上海</span>
            </li>
        </ul>

    </div>

</body>
</html>
