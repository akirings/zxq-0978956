<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册表</title>
    <style>
        textarea{resize: none;}
    </style>
</head>
<body>
    <from action="" method="post">
        <table brober="1" align="center"  width="500">
            <caption>青春不常在，抓紧谈恋爱</caption>
            <tr>
                <td><label for="">姓名</label></td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td><label for="">年龄</label></td>
                <td><input type="text"></td>
            </tr>
              <tr>
                <td><label for="">性别</label></td>
                <td><input type="radio" name="xb">男<input type="radio" name="xb">女</td>
            </tr>
            <tr>
                <td><label for="">生日</label></td>
                <td><input type="date"></td>
            </tr>
            <tr>
                <td><label for="">地址</label></td>
                <td>
                    <select name="" id="">
                        <option value="">四川</option>
                        <option value="">云南</option>
                        <option value="">贵州</option>
                        <option value="">广东</option>
                        <option value="">海南</option>
                        <option value="">江西</option>
                        <option value="">山西</option>
                        <option value="">陕西</option>
                    </select>
                </td>
            </tr>
             <tr>
                <td><label for="">学历</label></td>
                <td>
                    <select name="" id="">
                        <option value="">小学</option>
                        <option value="">初中</option>
                        <option value="">高中/职中</option>
                        <option value="">大专</option>
                        <option value="">本科</option>
                        <option value="">研究生</option>
                        <option value="">博士</option>
                        <option value="">其他</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td><label for="">手机号</label></td>
                <td><input type="tel" pattern="1[3,5,8,9][0-9]{9}"> </td>
            </tr>
              <tr>
                <td><label for="">邮箱</label></td>
                <td><input type="email"> </td>
            </tr>
            <tr>
                <td><label for="">创建密码</label></td>
                <td><input type="password" placeholder="8-20位密码和数字组合"> </td>
            </tr>
            <tr>
                <td><label for="">兴趣爱好</label></td>
                <td><input type="checkbox">唱歌<input type="checkbox">跳舞<input type="checkbox">打游戏<input type="checkbox">游泳</td>
            </tr>
            <tr>
                <td><label for="">幸运数字</label></td>
                <td><input type="number"> </td>
            </tr>
              <tr>
                <td><label for="">喜欢颜色</label></td>
                <td><input type="color"> </td>
            </tr>
              <tr>
                <td><label for="">自我介绍</label></td>
                <td><textarea name="" id="" rows="5" cols="30"></textarea>> </td>
            </tr>
            <tr>
                <td><label for="">个人照片</label></td>
                <td><input type="file"></td>
            </tr>
             <tr>
                <td></td>
                <td><input type="button" value="注册" style="background-color: rgb(183, 255, 255);">
                <input type="submit">
                <input type="reset" value="清空">
                <botton>注册</botton>
                </td>
            </tr>
        </table>
    </from>
</body>
</html>
